[pytest]
# Iter 292 (QA Meta-Layer, Part B) — flaky-test quarantine convention.
#
# Rule: any test that fails, then passes on an identical re-run with
# no code change, gets `@pytest.mark.flaky` and moves to a
# non-blocking suite. Still runs, still visible, but does NOT block
# a merge/deploy by itself.
#
# Ownership rule (from AGENTS.md): every @flaky test carries an
# `owner=<agent-name>` and `fix_by=<iter-number>` metadata via the
# `pytest.mark.flaky(reason="...", owner="...", fix_by=...)` args.
# A flaky test with no owner is a bug in the process, not a
# tolerated state.
#
# Quarantine ceiling: >5-10% of the suite tagged @flaky signals
# systemic async/timing issues. Treated as a priority item, not
# routine maintenance.

markers =
    flaky: quarantined intermittent test — non-blocking. Requires owner + fix_by.
    slow: test takes > 3 seconds; excluded from CI fast lane.
    integration: needs live external services (skip on smoke).
    llm_judge: uses live LLM-as-judge (real Emergent LLM key call, costs $$). Excluded from PR CI; run weekly via cron or on-demand.
    legacy: deliberately deferred pre-existing failure (iter36-iter267 era). Founder ruling 2026-07-29 - quarantined, NOT fixed, NOT deleted. Tracked in tests/legacy_quarantine.txt + .emergent/legacy-test-report.md. Non-blocking legacy lane in ci.yml runs them separately.
    live_env: needs the LIVE deployment at REACT_APP_BACKEND_URL. Auto-skipped (conftest probe) when {BASE}/api/health is not reachable - e.g. GitHub Actions, where no server exists. Runs and blocks normally in local/preview. Tracked in tests/live_env_quarantine.txt (founder-approved Step 3 triage, 2026-08-24).
    source_of_truth: locks in a founder-directed behavior contract so a future change can't silently overturn it without updating this same test in the same commit. W3 · 2026-08 governance ruling — a red source_of_truth test is its own LOUD, isolated CI signal (see the dedicated CI step below "Guard 21"-style, never lumped into the general/fitness-invariant bucket). Root cause this rule exists: the "Feb 2026 terminal-fail" verify change landed against `tests/test_iter309_phase03_self_heal_paused.py` without updating it, and it sat silently red inside the wider invariants job for ~5 weeks because nothing isolated it.
    known_fail_audit_2026_08: pre-existing failure quarantined by the 2026-08-28 guardrail-remediation Design Contract (C4) — distinct from the iter36-iter267 `legacy` ruling above. Excluded from the default run so it can never be confused with a NEW regression; tracked in ROADMAP.md "P1 — known gaps". Run explicitly via `pytest -m known_fail_audit_2026_08`.

# Default run: exclude @flaky, @llm_judge, @legacy AND
# @known_fail_audit_2026_08 so the CI blocking-lane stays green + free.
# The legacy lane runs explicitly with `pytest -m legacy`. source_of_truth
# tests are NOT excluded here — they run in the normal suite too;
# the dedicated CI step re-runs them in isolation so a red one can
# never be silently absorbed by an otherwise-red bucket.
addopts = -m "not flaky and not llm_judge and not legacy and not known_fail_audit_2026_08"

asyncio_mode = auto
