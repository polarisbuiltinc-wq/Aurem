    <!-- 2026-09 mobile PageSpeed round 2 — shared helper so both Meta
         Pixel and Google Ads gtag (the two biggest JS payloads on the
         page, ~650 KiB combined) fire on the FIRST real user signal
         (scroll/tap/keypress) instead of a fixed short timer, with an
         idle-callback fallback (now 4.5s, was 2.5-3s) so tracking
         still lands for a visitor who reads without touching
         anything. Real visitors almost always scroll/tap within the
         first second, so this pushes the third-party JS parse/eval
         cost further past LCP/TBT measurement without losing
         PageView/conversion data. -->
    <script>
    window.__auremDeferThirdParty = function(fn, idleTimeoutMs) {
      var fired = false;
      var events = ['scroll', 'pointerdown', 'touchstart', 'keydown', 'mousemove'];
      var run = function() {
        if (fired) return;
        fired = true;
        events.forEach(function(ev) { window.removeEventListener(ev, run); });
        fn();
      };
      events.forEach(function(ev) {
        window.addEventListener(ev, run, { passive: true, once: true });
      });
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(run, { timeout: idleTimeoutMs });
      } else {
        setTimeout(run, idleTimeoutMs);
      }
    };
    </script>

    <!-- Meta Pixel Code — Iter 388-ag (2026-02-14) · consent gate
         REMOVED per founder decision. The pixel now fires for EVERY
         visitor regardless of consent state or jurisdiction.

         ⚠️ COMPLIANCE NOTE (retained for future audits):
         This configuration is NOT GDPR / DPDP / CCPA compliant. If
         Aurem scales into EU, UK, California, India, Brazil, or any
         other opt-in jurisdiction, the consent-gated variant needs
         to come back OR founder must accept the regulatory risk
         (Meta itself is on the hook for its downstream tracking, but
         the DATA CONTROLLER — Aurem — is on the hook for lawful
         basis of collection). Global Privacy Control (GPC) is also
         no longer respected.

         Prior consent-gated version lived in this file at
         Iter 388-af (see git blame). To restore, wrap the loader
         below in `if (canLoad) { … }` where `canLoad` reads
         `aurem_consent.cats.marketing` from localStorage and
         checks `navigator.globalPrivacyControl`. -->
    <script>
    // Iter 391 · Deferred Meta Pixel bootstrap.
    // -----------------------------------------
    // We used to run the fbevents.js loader + fbq('init') + PageView
    // synchronously in <head>, which added ~250 ms of main-thread
    // script eval BEFORE the LCP paint on mobile (fbevents.js is
    // 110 KiB gzipped and its bootstrap logs a 192 ms long task per
    // Lighthouse Mobile). 2026-09: now uses __auremDeferThirdParty
    // (interaction-or-idle, see above) instead of a flat timer —
    // PageView is still sent well within the "first minute" window
    // Meta expects, and subsequent fbq('track', ...) calls
    // (CompleteRegistration, Lead, Purchase — Iter 389) work
    // identically because the fbq queue stub is created up-front and
    // drained once fbevents.js loads.
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      var boot=function(){
        if(f._fbqBooted)return; f._fbqBooted=true;
        t=b.createElement(e); t.async=!0; t.src=v;
        s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s);
        f.fbq('init','1571887197933821');
        f.fbq('track','PageView');
      };
      window.__auremDeferThirdParty(boot, 4500);
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    </script>

    <!-- Iter 156 — Google Ads conversion tracking (gtag.js)             -->
    <!-- =============================================================== -->
    <!--
      Loads Google Ads' global site tag for account AW-18239920865.
      `async` keeps it off the critical path; the inline init queues
      events that fire whenever the library finishes loading. Actual
      conversion events are dispatched from `src/lib/analytics.js`
      (trackSignup / trackPurchase) — keep all label literals there
      so this block stays tiny and cache-friendly.
    -->
    <!--
      Iter 391 · Deferred Google Ads gtag bootstrap. The gtag.js file
      is 152 KiB and its parse alone costs ~103 ms of main-thread
      time on the emulated Moto G Power. 2026-09: uses the shared
      __auremDeferThirdParty helper (interaction-or-idle, 4.5s
      fallback, was a flat 2.5-3s timer) while pre-creating the
      dataLayer + gtag stub in <head> so any early trackSignup /
      trackPurchase call from analytics.js just pushes into the queue
      and runs when the library lands. Consent Mode v2 defaults are
      set on the stub so the queued events inherit the DENY defaults
      exactly as before.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage:            'denied',
        analytics_storage:     'denied',
        ad_user_data:          'denied',
        ad_personalization:    'denied',
        functionality_storage: 'granted',
        security_storage:      'granted',
        wait_for_update:       500
      });
      gtag('js', new Date());
      gtag('config', 'AW-18239920865', { 'send_page_view': true });
      (function(){
        var loadGtag=function(){
          if(window.__gtagBooted)return; window.__gtagBooted=true;
          var s=document.createElement('script');
          s.async=true;
          s.src='https://www.googletagmanager.com/gtag/js?id=AW-18239920865';
          document.head.appendChild(s);
        };
        window.__auremDeferThirdParty(loadGtag, 4500);
      })();
    </script>
