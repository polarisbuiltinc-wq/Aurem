name: Quality Gate — Bug-fix Discipline

# Enforces AGENTS.md's bug-fix discipline mechanically:
# any PR that touches backend/routers/, backend/services/, or
# frontend/src/components/ MUST also touch at least one test file,
# OR carry an explicit override label. No exceptions, no silent
# opt-outs.
#
# This is the Layer 2 enforcement — the AGENTS.md rules alone
# cannot survive across sessions of agents that don't auto-load
# the file, so we add a mechanical gate the merge tooling
# actually respects.

on:
  # Iter 306 — trigger reality-check. Support agent confirmed that
  # Emergent's "Save to GitHub" lets the user pick ANY branch (no
  # fixed pattern) and does NOT auto-merge into main. So a pure
  # `pull_request`-only trigger silently skipped every push where
  # the user hadn't opened a PR yet. Hybrid trigger below:
  #   - push on ANY branch → the actual test suites (vitest, visual,
  #     lighthouse, invariants) run immediately on every Emergent save.
  #   - pull_request into main/master → the two diff-based gates
  #     (bug-fix-discipline, test-style-guard) run at merge time,
  #     because they need pull_request.base.sha / head.sha to diff.
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bug-fix-discipline:
    name: PR must include a test change (or explicit override)
    # Diff-based gate; needs pull_request.base.sha and head.sha.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check labels for explicit override
        id: labels
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "labels=$labels"
          if echo "$labels" | grep -qE '"(docs-only|no-test-needed)"'; then
            echo "override=true" >> "$GITHUB_OUTPUT"
          else
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff-based gate
        if: steps.labels.outputs.override != 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA"

          # All files changed in this PR.
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          echo "----"

          # A PR is "fix-shaped" if it touches production code paths.
          FIX_SHAPED=$(echo "$CHANGED" | grep -E \
            '^(backend/(routers|services|models)/|frontend/src/(components|pages|hooks|lib)/)' \
            || true)

          if [ -z "$FIX_SHAPED" ]; then
            echo "OK — PR does not touch production code paths, no test required."
            exit 0
          fi

          echo "PR touches production code paths:"
          echo "$FIX_SHAPED"
          echo "----"

          # It must also touch at least one test file.
          TEST_TOUCHED=$(echo "$CHANGED" | grep -E \
            '(^|/)test_[^/]+\.py$|(^|/)[^/]+\.test\.(js|jsx|ts|tsx)$|(^|/)tests/' \
            || true)

          if [ -n "$TEST_TOUCHED" ]; then
            echo "OK — PR includes test changes:"
            echo "$TEST_TOUCHED"
            exit 0
          fi

          echo "::error::PR touches production code but includes no test change."
          echo ""
          echo "AGENTS.md bug-fix discipline requires either:"
          echo "  1. Add a regression test named test_regression_iter<N>_<desc>"
          echo "     in /app/backend/tests/  (or the appropriate frontend"
          echo "     test dir).  See /app/AGENTS.md for details."
          echo "  2. Or add one of these labels to the PR to override:"
          echo "        [docs-only]  |  [no-test-needed]"
          echo "     Overrides require explicit reviewer sign-off."
          echo ""
          echo "Files that changed production code without an accompanying test:"
          echo "$FIX_SHAPED"
          exit 1

      - name: Override acknowledgement
        if: steps.labels.outputs.override == 'true'
        run: |
          echo "Override label present — skipping test-file requirement."
          echo "Reviewer must sign off on this explicitly."

  invariants:
    name: Fitness-function invariants (always green on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Iter 347 — the invariants subset includes DB-touching suites;
      # the job env already pointed MONGO_URL at localhost:27017 but
      # no Mongo was ever started on the runner. Root fix: real
      # service container (same pattern as ci.yml backend-tests).
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Iter 306 — emergentintegrations is served from Emergent's
          # private index (not on public PyPI). Without this URL the
          # install fails on GH-hosted runners and blocks the whole
          # gate. Source: `pip install emergentintegrations
          # --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/`
          # 2026-08-26 — CI Retry mechanism: 3 attempts w/ backoff for
          # this network install only — never applied to test results
          # (see --only-rerun on the test step below for that half).
          for attempt in 1 2 3; do
            pip install -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done
      # 2026-08-25 — same CI-tooling gap fix as ci.yml: this job runs
      # test_iter212m62_loop_verify.py (via the "loop" keyword filter
      # below) which shells out to real `ruff`/`eslint` binaries;
      # neither was ever installed on this runner, so every linter-
      # outcome assertion there saw the documented graceful "skip"
      # fallback instead of a real lint result.
      - name: Install ruff + eslint (for loop_verify tests)
        run: |
          pip install --quiet ruff
          npm install -g eslint@8 --quiet
      - name: Map workspace to /app (legacy hardcoded test paths)
        # Iter 349 — 35 collection errors on runners: older tests
        # exec scripts via hardcoded /app/backend/... paths (pod
        # convention). A symlink makes the whole class work on
        # GH-hosted runners without touching 35 files.
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /app
      - name: Boot backend in background
        # 2026-08-26 — ROOT FIX: this job never started a backend, but
        # a real chunk of the "invariant" selection (test_loop_gate_*,
        # test_regression_iter297_p0_journey_coverage, etc.) makes
        # REAL `requests.post(REACT_APP_BACKEND_URL + ...)` HTTP calls
        # (signup/login/loop-start) and asserts against a `mongo`
        # fixture reading the SAME MONGO_URL/DB_NAME below. With no
        # server listening on :8001, every such test either connection-
        # errors outright, or — if a stray process happens to answer on
        # :8001 pointed at a DIFFERENT database — passes signup but
        # fails the Mongo assertion ("no dev_users row for X") because
        # the HTTP call and the Mongo read land in two different DBs.
        # Verified live: running this exact test selection locally with
        # a real backend bound to the SAME MONGO_URL/DB_NAME as this
        # job eliminates the "no dev_users row" failure class entirely.
        # Same uvicorn-boot pattern already used by visual-regression
        # (below) and ci.yml's Simulated-user QA job.
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME:   aurem_ci_smoke
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          AUREM_MASTER_KEY: ci-vault-master-key-32-chars-min!!
          AUREM_CTO_MASTER_KEY: ci-cto-vault-master-key-32-chars!!
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
      - name: Run regression + invariant tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME:   aurem_ci_smoke
          # 2026-08-24 · CI-job triage — this job was missing these two
          # vars that several test modules read at COLLECTION time
          # (module-level `os.environ.get(...).rstrip("/")` /
          # `RuntimeError: JWT_SECRET must be set`), causing pytest
          # collection errors on every run regardless of -k filtering.
          # Values mirror the same job's Mongo pattern + ci.yml's
          # backend-tests job (JWT_SECRET) and quality-gate.yml's own
          # lighthouse/vitest jobs (REACT_APP_BACKEND_URL).
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          REACT_APP_BACKEND_URL: http://localhost:8001
          # 2026-06 · first real post-billing-fix run — invariants job
          # errored at setup: is_vault_available() requires a >=32-char
          # master key (services/vault.py + cto_services/crypto.py).
          # CI dummy values, same pattern as JWT_SECRET above.
          AUREM_MASTER_KEY: ci-vault-master-key-32-chars-min!!
          AUREM_CTO_MASTER_KEY: ci-cto-vault-master-key-32-chars!!
        run: |
          # Iter 309 · Phase 0.2 — DISCOVERY-BASED test collection.
          # Prior version was a hardcoded whitelist of specific test
          # node IDs (11 tests). Every new test file added to the
          # repo was invisible to CI unless someone manually
          # appended it to the whitelist — this is the actual
          # mechanism behind the "13 silent test failures" the audit
          # flagged. Discovery-based collection with a keyword filter
          # picks up new regression/invariant tests automatically.
          #
          # Keyword patterns intentionally broad — covers historical
          # `test_regression_iter*` and `test_invariants_*` naming
          # plus new iter309+ conventions plus any test containing
          # the word "canary" (Phase 0.2 CI-signal probes).
          # DB-backed tests that need a real Mongo instance still
          # live in ci.yml's backend-tests job (which spins one up).
          # This job intentionally runs the STATIC / mock-DB subset
          # for a fast <60s gate.
          # Iter 309 · Phase 0.2 (post-canary) — added `loop` to the
          # discovery keyword filter permanently now that CI failure
          # propagation is proven. The Loop engine is the platform's
          # heart; regressions here (stuck states, missing heartbeats,
          # phase-mapping drift) must fail the gate immediately, not
          # hide inside the wider ci.yml suite.
          python -m pytest tests/ \
            -k "regression or invariant or iter309 or ci_canary or frontend_sync or execute_stuck_recovery or jwt_revocation or self_heal_paused or loop" \
            --tb=short -q \
            --reruns 1 --reruns-delay 3 \
            --only-rerun "ConnectionError|ConnectionRefusedError|TimeoutError|RemoteDisconnected|ConnectionResetError" \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py
      - name: Guard — Source-of-truth trip-wires (isolated, must never be silently red)
        # W3 · 2026-08 — same governance rule as ci.yml's dedicated
        # step: this exact job's broad -k filter above already ran
        # these tests (it matches "self_heal_paused"/"loop"), but
        # lumped into one aggregate pass/fail count where a single
        # red trip-wire is invisible inside a wider red job. Isolate
        # it so it's loud regardless of the step above's outcome.
        if: always()
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME:   aurem_ci_smoke
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          REACT_APP_BACKEND_URL: http://localhost:8001
          AUREM_MASTER_KEY: ci-vault-master-key-32-chars-min!!
          AUREM_CTO_MASTER_KEY: ci-cto-vault-master-key-32-chars!!
        run: python -m pytest -m source_of_truth -v --tb=short --timeout=30
      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi

  guardrails:
    # 2026-08 audit remediation (C2) — permanent regression suite, one
    # module per audit rule (tests/guardrails/). No Mongo service
    # needed (fake in-memory db per test, same pattern as the writer/
    # LLM-config suites) — keeps this job fast (<5 min per C2's own
    # requirement). Runs on every push/PR, not gated to pull_request
    # only, so it catches regressions on Emergent's direct-push save
    # path too (same reasoning as new-bloat-guard above).
    name: Guardrail regression suite (audit rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            pip install -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done
      - name: Run guardrail suite
        working-directory: backend
        run: python -m pytest tests/guardrails/ -v --tb=short

  test-style-guard:
    # Iter 291 — block PRs that add new test files whose STATIC_GREP
    # ratio > 60%. The founder-agreed rule (iter290 real-measurement
    # finding: 50.7% of existing suite is grep-only) is: no NEW test
    # file may compound that debt. Files can opt out via a
    # `# static-grep-ok: <reason>` magic comment (e.g. mutation
    # suites, which are grep-style by design).
    name: Static-grep threshold on new tests
    # Diff-based; needs pull_request.base.sha and head.sha.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test-style guard on PR diff
        working-directory: backend
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA for test-style violations"
          python scripts/ci_check_test_style.py "$BASE_SHA" "$HEAD_SHA"


  new-bloat-guard:
    # Phase 0 (2026-08) — founder directive: stop the 173-bloated-file /
    # 454-complex-function backlog from growing while Phase 2/3 pays it
    # down. Blocks any NEW file (backend/{routers,services,core,
    # cto_services}, frontend/src) over 300 real source lines, or any
    # NEW Python function with cyclomatic complexity > 10.
    #
    # Runs on BOTH push and pull_request (unlike bug-fix-discipline /
    # test-style-guard above, which are pull_request-only) — Emergent's
    # "Save to GitHub" pushes directly with no PR, so a PR-only gate
    # would never fire on the actual deploy path. Diff-range resolution
    # mirrors ci.yml's delete-gate job for the same reason.
    name: New-file bloat guard (size + complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install radon
        run: pip install radon==6.0.1 --quiet
      - name: Resolve diff range + override + run guard
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50 || true
            BASE_SHA="origin/$BASE_REF"
            HEAD_SHA="HEAD"
          else
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
              BASE_SHA="HEAD~1"
            else
              BASE_SHA="$BEFORE"
            fi
            HEAD_SHA="$SHA"
          fi
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"bloat-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B "$HEAD_SHA" | grep -q '\[bloat-approved\]'; then
            OVERRIDE="--override"
          fi
          echo "Diffing $BASE_SHA..$HEAD_SHA (override: ${OVERRIDE:-none})"
          python backend/scripts/ci_check_new_bloat.py "$BASE_SHA" "$HEAD_SHA" $OVERRIDE


  frontend-vitest:
    # Iter 302 — Frontend QA Charter Layer 1 + Layer 3 C2.
    # Runs the RTL state-sync suite AND the axe-core component-level
    # a11y suite. Baseline discipline: axe assertions only fail on
    # NEW violation ids (see docs/a11y_baseline.json).
    name: Vitest (RTL state-sync + axe component a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile || { echo "::warning::yarn.lock out of sync in repo - falling back to yarn install"; yarn install; }
      - name: Vitest full run
        working-directory: frontend
        run: yarn test


  visual-regression:
    # Iter 299 — Frontend QA Charter Layer 2. Pixel-diff the 5
    # canonical unauthenticated routes against committed baselines
    # in frontend/tests/visual/__screenshots__/. See
    # docs/visual_regression.md for the workflow.
    name: Visual regression (Playwright chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 2026-08-24 · CI-job triage — this job never started a backend,
    # so every "landing"/"why-ora"/"demo"/"login"/ship-gate screenshot
    # was actually capturing the frontend's own error-boundary fallback
    # ("Brief Hiccup — Reconnecting") because it couldn't reach
    # localhost:8001. The ~4-5% pixel diffs were the spinner icon's
    # rotation frame, not a real product regression. Root cause
    # confirmed by downloading a failing run's playwright-report
    # artifact and viewing both the actual + expected PNGs directly —
    # both show the fallback screen, not the real page. Fix: boot a
    # real backend (same mongodb-service + uvicorn pattern already
    # used by ci.yml's "Simulated-user QA" job) before starting the
    # frontend.
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL:  mongodb://localhost:27017
      DB_NAME:    aurem_visual_ci
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          # 2026-08-26 — CI Retry mechanism: network-install retry only,
          # scoped exactly like ci.yml/quality-gate.yml's invariants job.
          for attempt in 1 2 3; do
            pip install -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done
      - name: Boot backend in background
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile || { echo "::warning::yarn.lock out of sync in repo - falling back to yarn install"; yarn install; }
      - name: Install Playwright browsers (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        env:
          # Point at the built preview so tests hit static assets;
          # we still serve on :3000 like the pod does.
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: |
          yarn start &
          echo "started; waiting for :3000 ..."
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://localhost:3000/; then
              echo "frontend up after ${i}s"; break
            fi
            sleep 1
          done
      - name: Run visual regression
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse-ci:
    # Iter 305 — Frontend QA Charter Layer 4. Runs Lighthouse against
    # the PRODUCTION build (`yarn build && yarn preview`) — NEVER the
    # dev server (Vite serves unbundled modules and inflates LCP ~4x).
    # Google's "Good" Core Web Vitals as the hard gate:
    #   LCP ≤ 2500ms · TBT ≤ 200ms · CLS ≤ 0.1
    # See docs/performance_budget.md for the founder-approved rationale.
    name: Lighthouse CI (Core Web Vitals)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile || { echo "::warning::yarn.lock out of sync in repo - falling back to yarn install"; yarn install; }
      - name: Build production bundle
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: yarn build
      - name: Run Lighthouse CI (autorun spawns `yarn preview`)
        working-directory: frontend
        run: npx lhci autorun --config=.lighthouserc.json
      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

  auto-qa-agent:
    # Iter 334 — Auto-QA agent (founder charter). Decides test scope
    # from the actual commit diff, runs the mapped scenarios at the
    # SERVICE layer (pytest on real state-machine suites + direct
    # tool_executor calls — no browser, no LLM tokens for backend
    # checks), and writes .emergent/latest-qa-report.md. UI-level
    # ship-gate coverage runs in visual-regression (ship_gate.spec.js
    # is auto-collected by `npx playwright test` there).
    name: Auto-QA agent (scope-decided scenarios + report)
    needs: [invariants, frontend-vitest, visual-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
      - name: Get diff and commit message
        id: diff
        run: |
          echo "MESSAGE<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "FILES<<EOF" >> $GITHUB_OUTPUT
          git diff --name-only HEAD~1 HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run auto-QA agent
        working-directory: backend
        env:
          QA_BOT_SESSION_TOKEN: ${{ secrets.QA_BOT_SESSION_TOKEN }}
          MONGO_URL: mongodb://localhost:27017
          DB_NAME:   aurem_ci_smoke
          COMMIT_MESSAGE: ${{ steps.diff.outputs.MESSAGE }}
          CHANGED_FILES:  ${{ steps.diff.outputs.FILES }}
        # NOTE: `python -m services.qa_matrix.run_auto` (original spec)
        # is not importable — qa_matrix is a module, not a package.
        # The CLI entrypoint lives in qa_matrix.__main__ guard instead.
        run: |
          python -m services.qa_matrix \
            --message "$COMMIT_MESSAGE" \
            --files "$CHANGED_FILES" \
            --sha "$(git rev-parse --short HEAD)"
      - name: Commit report back to repo
        if: ${{ github.event_name == 'push' }}
        env:
          QA_REPORT_COMMIT_TOKEN: ${{ secrets.QA_REPORT_COMMIT_TOKEN }}
        run: |
          if [ -z "$QA_REPORT_COMMIT_TOKEN" ]; then
            echo "QA_REPORT_COMMIT_TOKEN not configured — report kept as artifact only"
            exit 0
          fi
          git config user.name "qa-agent-bot"
          git config user.email "qa-bot@auremcto.com"
          git remote set-url origin "https://x-access-token:${QA_REPORT_COMMIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add .emergent/latest-qa-report.md .emergent/qa-history/
          # [skip ci] prevents the report commit from re-triggering
          # this workflow in an infinite loop.
          git commit -m "qa-agent: report for $(git rev-parse --short HEAD~1) [skip ci]" || echo "no changes to commit"
          git push || echo "push skipped (protected branch or no delta)"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-qa-report
          path: .emergent/latest-qa-report.md
          retention-days: 14
