name: Weekly Simulated-User QA (regression detection + G1 route sweep)

# Passive regression detector — runs the promptfoo suite every
# Monday 09:00 UTC (~14:30 IST) even when no PR is open, so an
# upstream LLM provider drift (Anthropic model rev, OpenRouter route
# change) doesn't silently degrade our agent behaviour until a
# customer complains.
#
# Cost: ~$0.007 per run (4-6 LLM calls) — negligible.
# On failure: posts to the CI-alerts Slack webhook (same one deploy
# events already use) so the founder sees a real diff-diff report
# within hours of a regression, not weeks.
#
# Directive Session 5 · post-audit follow-up.
#
# Iter 367 (Item A) — Added a parallel job `g1-route-sweep` that
# runs `backend/scripts/g1_route_smoke_sweep.py` against the LIVE
# production URL (auremcto.com). Independent of the promptfoo job;
# both must go green for the workflow to pass. This closes the last
# regression-guard (G1) that was written but had no cron trigger.

on:
  schedule:
    - cron: "0 9 * * 1"    # every Monday 09:00 UTC
    - cron: "0 9 * * *"    # G1 also runs DAILY 09:00 UTC (Item A) so a
                            # broken public route is caught within 24h,
                            # not 7 days. Both jobs are cron-triggered;
                            # `if:` branches gate which one runs.
  workflow_dispatch: {}    # allow manual triggering from Actions tab

concurrency:
  group: qa-weekly
  cancel-in-progress: false   # weekly runs must not cancel each other

jobs:
  qa-weekly:
    name: Weekly QA baseline (promptfoo)
    # Only runs on Monday's schedule OR manual dispatch — the daily
    # 09:00 cron is reserved for the G1 sweep below.
    if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_SHARE:              "true"
      PROMPTFOO_DISABLE_TELEMETRY:          "true"
      AUREM_QA_MODE:  "true"
      AUREM_QA_TOKEN: "qa-weekly-cron-token-must-be-32-chars!"
      MONGO_URL:            mongodb://localhost:27017
      DB_NAME:              aurem_qa_weekly
      JWT_SECRET:           ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      EMERGENT_LLM_KEY:     ${{ secrets.EMERGENT_LLM_KEY }}
      AUREM_CTO_MASTER_KEY: ci-test-master-key-32-chars-long!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/simulated-user/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations is on Emergent's private
          # index (not public PyPI); GH runner needs --extra-index-url.
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Boot backend
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done

      - name: Install promptfoo
        working-directory: qa/simulated-user
        run: npm ci --no-audit --no-fund

      - name: Run suite
        id: run_suite
        working-directory: qa/simulated-user
        env: { CI: "true" }
        # `|| true` so a failure doesn't kill the workflow — we WANT
        # to reach the Slack notify step and report the failure.
        run: |
          bash run.sh || echo "SUITE_FAILED=1" >> "$GITHUB_ENV"

      - name: Compute pass/fail summary
        id: summary
        run: |
          if [[ -f /tmp/aurem_qa_report.json ]]; then
            # Iter 306 — was a single-quoted multi-line bash string
            # with lines starting at column 0, which YAML rejected
            # (`could not find expected ':'`). Rewritten as a single
            # `python3 -c` invocation with semicolon-separated
            # statements so every line stays inside the `run: |`
            # block at the correct indent.
            SUMMARY=$(python3 -c "import json; d=json.load(open('/tmp/aurem_qa_report.json')); r=d.get('results',{}).get('results') or []; p=sum(1 for x in r if x.get('success')); f=sum(1 for x in r if not x.get('success')); print(f'{p}/{p+f}')")
            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          else
            echo "summary=report-missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Slack — success
        if: env.SUITE_FAILED != '1' && env.SLACK_WEBHOOK != ''
        env: { SLACK_WEBHOOK: "${{ secrets.CI_ALERTS_SLACK_WEBHOOK }}" }
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":white_check_mark: AUREM weekly QA baseline: ${{ steps.summary.outputs.summary }} pass — no regressions.\"}" \
            || true

      - name: Post to Slack — failure
        if: env.SUITE_FAILED == '1' && env.SLACK_WEBHOOK != ''
        env: { SLACK_WEBHOOK: "${{ secrets.CI_ALERTS_SLACK_WEBHOOK }}" }
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":rotating_light: AUREM weekly QA baseline DEGRADED: ${{ steps.summary.outputs.summary }} pass. Report artifact + logs: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|open run>. Likely cause: upstream LLM provider drift OR recent orchestrator change.\"}" \
            || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-qa-report
          path: /tmp/aurem_qa_report.json
          retention-days: 90    # 3 months of weekly baselines for drift analysis

      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi

      - name: Fail the workflow if suite failed
        if: env.SUITE_FAILED == '1'
        run: exit 1


  # ─── Iter 367 (Item A) · Daily G1 route smoke sweep ───────────────
  # Runs backend/scripts/g1_route_smoke_sweep.py against the live
  # production URL (auremcto.com) every day at 09:00 UTC.
  # Fails the workflow on any 4xx/5xx status, empty <main>, or
  # rendered "NaN"/"undefined"/"Invalid Date"/stack-trace text.
  g1-route-sweep:
    name: G1 · Playwright route smoke sweep (prod daily)
    # Runs on the DAILY cron slot AND on manual dispatch (dispatch
    # runs both jobs so operators can trigger a full check).
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      G1_BASE_URL: "https://auremcto.com"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Playwright + deps
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run G1 route sweep
        id: sweep
        run: |
          python backend/scripts/g1_route_smoke_sweep.py \
            --base-url "$G1_BASE_URL" \
            --out-json /tmp/g1_sweep.json
        # Exit code 1 means one or more routes failed — the workflow
        # step naturally fails, which surfaces on the Actions tab.

      - name: Post to Slack — failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env: { SLACK_WEBHOOK: "${{ secrets.CI_ALERTS_SLACK_WEBHOOK }}" }
        run: |
          # Parse the JSON to include the failed URLs in the alert.
          if [[ -f /tmp/g1_sweep.json ]]; then
            SUMMARY=$(python3 -c "import json; d=json.load(open('/tmp/g1_sweep.json')); fails=[r for r in d['results'] if not r['ok']]; print(f\"{len(fails)}/{d['total']} routes broken: \" + ', '.join(r['url'] for r in fails[:5]))")
          else
            SUMMARY="G1 sweep did not produce a report — sweep binary crashed"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":rotating_light: G1 route sweep FAILED on auremcto.com — $SUMMARY. Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|open>\"}" \
            || true

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-sweep-report
          path: /tmp/g1_sweep.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # Iter 367 · Session 4 — G15 · Dependency vulnerability scan
  # Runs `backend/scripts/g15_dependency_scan.py` which merges
  # pip-audit (backend/requirements.txt) + yarn audit (frontend/
  # yarn.lock) through a single allowlist. Fails the job on any
  # HIGH/CRITICAL finding not on `scripts/g15_allowlist.json`.
  #
  # Runs on the DAILY cron slot so a new CVE dropping into a
  # transitive dep is caught within 24h, not 7 days.
  # ─────────────────────────────────────────────────────────────
  g15-dependency-scan:
    name: G15 · Dependency vulnerability scan (pip + yarn)
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache — we want a fresh yarn install so audit reads a
          # fresh lock resolution (catches lockfile drift too).

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Install frontend deps (yarn.lock is committed)
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run G15 dependency scan
        id: g15
        run: |
          python backend/scripts/g15_dependency_scan.py

      - name: Post to Slack — failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env: { SLACK_WEBHOOK: "${{ secrets.CI_ALERTS_SLACK_WEBHOOK }}" }
        run: |
          curl -sS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\":rotating_light: G15 dependency scan FAILED — new HIGH/CRITICAL CVE in pip or yarn deps. Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|open>\"}" \
            || true
