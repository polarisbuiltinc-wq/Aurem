name: AUREM Auto-Deploy
# ─────────────────────────────────────────────────────────────────────
# Installed by AUREM's GitHub deploy service. Validates an AUREM PR
# (labeled `aurem-autofix`), then on merge into the default branch
# triggers the customer's existing deploy webhook and reports the
# outcome back to the AUREM dashboard.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   • AUREM_DEPLOY_HOOK_URL  — your deploy provider webhook URL
#   • AUREM_API_KEY          — your AUREM customer API key
#   • AUREM_DEPLOY_TARGET    — vercel | render | fly | hetzner | custom
#   • AUREM_NOTIFY_EMAIL     — recipient for deploy notifications (optional)
#
# Required repo variables (Settings → Variables):
#   • AUREM_REPORT_URL       — https://auremcto.com/api/aurem-dev/github-deploy/report
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [labeled, opened, synchronize]
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: aurem-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-aurem-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'aurem-autofix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify PR opened by AUREM
        env:
          PR_USER:  ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$PR_USER" != "aurem-bot" ] && [[ "$PR_TITLE" != "[AUREM]"* ]]; then
            echo "::error::PR is labeled aurem-autofix but not opened by AUREM"
            exit 1
          fi
          echo "AUREM PR validated."

  gate-on-ci:
    # Iter 139 — block deploy until the CI + Quality Gate workflows
    # (ci.yml + quality-gate.yml) on the SAME commit report success.
    # Real gate, not a stub: polls the GitHub REST API every 15s for
    # up to 12 minutes.
    #
    # 2026-08-24 · CONFIRMED bug fix (Inventory Sweep + Pillar 2
    # deploy-gate work) — CI_NAME here was "AUREM CI — Test Suite",
    # which never matches ci.yml's actual `name:` field ("AUREM CI —
    # Build + Test Guard"). Every run therefore looked like "CI never
    # triggered" and fell through to the manual-override branch,
    # which ALLOWED every deploy regardless of real CI result
    # (fail-open). Fixed the name AND added quality-gate.yml (the
    # workflow with the bug-fix-discipline/vitest/visual-regression/
    # invariants jobs) to the same poll. Also flipped the "did not
    # complete in time" branch from allow → BLOCK (fail-closed
    # default, per founder direction) — only a workflow that was
    # genuinely never triggered for this SHA is treated as "no
    # opinion" and allowed through, matching GitHub's own required-
    # status-check semantics.
    name: Wait for CI + Quality Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Poll CI + Quality Gate workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA:  ${{ github.sha }}
        run: |
          set -e
          DEADLINE=$(( $(date +%s) + 720 ))   # 12 min hard cap
          CI_NAME="AUREM CI — Build + Test Guard"
          QG_NAME="Quality Gate — Bug-fix Discipline"
          echo "Waiting for '$CI_NAME' and '$QG_NAME' on commit $SHA"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUNS=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              | python3 -c "import json,sys; [print(r['name']+'|'+r['status']+'|'+(r['conclusion'] or 'null')) for r in json.load(sys.stdin).get('workflow_runs', [])]")
            CI_LINE=$(echo "$RUNS" | grep -F "$CI_NAME|" | head -1 || true)
            QG_LINE=$(echo "$RUNS" | grep -F "$QG_NAME|" | head -1 || true)
            if [ -z "$CI_LINE" ] || [ -z "$QG_LINE" ]; then
              echo "  not yet listed for this commit (ci='$CI_LINE' qg='$QG_LINE') — waiting…"
              sleep 15
              continue
            fi
            CI_STATUS=$(echo "$CI_LINE" | cut -d'|' -f2)
            CI_CONCLUSION=$(echo "$CI_LINE" | cut -d'|' -f3)
            QG_STATUS=$(echo "$QG_LINE" | cut -d'|' -f2)
            QG_CONCLUSION=$(echo "$QG_LINE" | cut -d'|' -f3)
            echo "  CI status=$CI_STATUS conclusion=$CI_CONCLUSION | QG status=$QG_STATUS conclusion=$QG_CONCLUSION"
            if [ "$CI_STATUS" = "completed" ] && [ "$QG_STATUS" = "completed" ]; then
              if [ "$CI_CONCLUSION" = "success" ] && [ "$QG_CONCLUSION" = "success" ]; then
                echo "✅ CI + Quality Gate passed — gate open. Deploying commit $SHA"
                exit 0
              fi
              echo "::error::CI conclusion='$CI_CONCLUSION' QG conclusion='$QG_CONCLUSION' — blocking deploy"
              exit 1
            fi
            sleep 15
          done
          echo "::error::CI/Quality Gate did not complete within 12min — blocking deploy (fail-closed default, 2026-08-24)"
          exit 1

  deploy-and-report:
    if: github.event_name == 'push'
    needs: [gate-on-ci]
    runs-on: ubuntu-latest
    env:
      # Iter 306 — `secrets` context is not allowed inside step-level
      # `if:`. Hoist secrets into job-level env so the individual
      # steps can gate themselves via `env.X != ''`, which IS allowed.
      HOOK:    ${{ secrets.AUREM_DEPLOY_HOOK_URL }}
      API_KEY: ${{ secrets.AUREM_API_KEY }}
    steps:
      - name: Trigger customer deploy webhook
        id: trigger
        if: env.HOOK != ''
        run: |
          set +e
          HTTP=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
                      -X POST "$HOOK" \
                      -H "Content-Type: application/json" \
                      -d "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}")
          echo "deploy_status=$HTTP" >> $GITHUB_OUTPUT
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            cat /tmp/deploy_resp.txt
          fi
      - name: Report to AUREM
        if: env.API_KEY != ''
        env:
          REPORT_URL: ${{ vars.AUREM_REPORT_URL }}
          RESULT:     ${{ steps.trigger.outputs.result || 'success' }}
          REPO:       ${{ github.repository }}
          COMMIT:     ${{ github.sha }}
        run: |
          URL="${REPORT_URL:-https://auremcto.com/api/aurem-dev/github-deploy/report}"
          curl -s -X POST "$URL" \
               -H "Content-Type: application/json" \
               -d "{\"api_key\":\"$API_KEY\",\"commit\":\"$COMMIT\",\"status\":\"$RESULT\",\"repo\":\"$REPO\"}" \
               || echo "Report to AUREM failed (non-fatal)"
