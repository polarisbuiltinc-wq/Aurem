name: AUREM CI — Build + Test Guard

on:
  # Iter 309 · Phase 0.2 — CI trigger reality check (round 2).
  # Round 1 (iter 306) fixed quality-gate.yml's on: to include
  # `push: branches: **`. This workflow (ci.yml) was NOT updated at
  # the same time — it kept `push: branches: [main, master, dev,
  # staging]` which meant no feature branch push (e.g. Emergent's
  # Save-to-GitHub picking any custom branch) ever triggered the
  # backend pytest job. Founder pushed `phase-0.2-canary` to prove
  # CI failure propagation; ci.yml never fired because the branch
  # name didn't match the whitelist. Symmetry with quality-gate.yml
  # restored below.
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  frontend-build:
    name: Frontend — Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || { echo "::warning::yarn.lock out of sync in repo - falling back to yarn install"; yarn install; }

      - name: Build check
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://aurem.live
          CI: "false"
        run: |
          yarn build 2>&1 | tee /tmp/build_output.txt
          if grep -iE "error TS|SyntaxError|Module not found|Failed to compile|Parsing error" /tmp/build_output.txt; then
            echo "❌ BUILD FAILED — broken code detected"
            exit 1
          fi
          echo "✅ Build passed"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: /tmp/build_output.txt
          retention-days: 7


  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    # 2026-06 · was 10 — first real post-billing-fix run was killed at
    # the job timeout mid-suite (93%), hiding the true failure list.
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: aurem_test
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_MASTER_KEY: ci-test-master-key-32-chars-long!!
      REDIS_URL: ""
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Phase 0 coverage-ratchet guard below needs a real base..head
          # diff range, not a 1-commit shallow clone.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # 2026-08-27 — fail-fast dependency resolution check. Catches a
      # broken requirements.txt (e.g. a version conflict between a
      # direct pin and a transitive requirement — exactly what happened
      # with the litellm/emergentintegrations conflict) in seconds, with
      # an unambiguous "resolution is broken" signal, instead of only
      # discovering it minutes later as an ambiguous "install step
      # failed" from inside the retry loop below (which can't tell a
      # permanent ResolutionImpossible apart from a transient network
      # blip — it just retries a doomed install 3 times either way).
      - name: Dependency resolution check (fail-fast)
        working-directory: backend
        run: |
          pip install --dry-run --no-cache-dir -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
            || { echo "::error::requirements.txt does not resolve — fix the conflict before pushing (see the pip error above for the exact clashing packages)."; exit 1; }

      - name: Install dependencies
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations lives on Emergent's private
          # index (not on public PyPI), so GH-hosted runners need the
          # --extra-index-url to resolve it.
          # 2026-08-26 — CI Retry mechanism (infra-flake only, scoped):
          # network installs get 3 attempts w/ backoff. This never
          # touches test assertions — see the `--only-rerun` regex on
          # the "Run tests" step below for that half of the mechanism.
          for attempt in 1 2 3; do
            pip install --no-cache-dir -r requirements.txt \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
              pytest pytest-asyncio pytest-cov pytest-timeout pytest-rerunfailures httpx --quiet \
              && break
            echo "::warning::pip install attempt $attempt failed — retrying in $((attempt * 5))s"
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done

      # 2026-08-25 — services/loop_verify.py shells out to `ruff`/`eslint`
      # for the loop's real static-analysis step, with a documented
      # graceful "skip" fallback when a binary is missing (Iter 212m-166,
      # so production never crashes over it). Neither binary was ever
      # installed on this runner, so test_iter212m62_loop_verify.py's
      # linter-outcome assertions always saw "skip" here — a CI-tooling
      # gap, not an app bug. Matching install now added so the runner
      # can exercise the real linter path like the pod does.
      - name: Install ruff + eslint (for loop_verify tests)
        run: |
          pip install --quiet ruff
          npm install -g eslint@8 --quiet

      - name: Map workspace to /app (legacy hardcoded test paths)
        run: sudo ln -sfn "$GITHUB_WORKSPACE" /app

      - name: Guard 18 — universal timeout audit (Iter 359)
        working-directory: backend
        run: python scripts/timeout_audit.py

      - name: Guard 21 — OWASP/CWE misconfig + supply-chain scan (Iter 361)
        working-directory: backend
        run: python scripts/g21_security_scan.py

      - name: Iter 364 — Pricing copy truth gate
        working-directory: backend
        run: python scripts/pricing_copy_lint.py

      - name: Run tests
        working-directory: backend
        run: |
          # Iter 309 · Phase 0.2 · Round 6 — CAPTURE pytest exit code
          # IMMEDIATELY. Round 5 added a grep-based canary-proof block
          # AFTER the pytest pipe and BEFORE `exit ${PIPESTATUS[0]}`,
          # which clobbered PIPESTATUS to point at the grep (always 0
          # when the canary line is present) instead of pytest.
          # Result: every failing pytest run showed the step as GREEN
          # because $? by the time exit ran was zero. Classic
          # bash-pipe exit-code trap. `set -o pipefail` also enabled
          # as belt-and-braces so the `2>&1 | tee` pipe returns the
          # left-hand exit code by default.
          set -o pipefail
          python -m pytest \
            --tb=short \
            --timeout=30 \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --continue-on-collection-errors \
            --reruns 1 --reruns-delay 3 \
            --only-rerun "ConnectionError|ConnectionRefusedError|TimeoutError|RemoteDisconnected|ConnectionResetError" \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py \
            2>&1 | tee /tmp/pytest_output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "Pytest exit code (captured immediately): $PYTEST_EXIT"

          # Exit with pytest's exit code (captured before any post-processing).
          exit "$PYTEST_EXIT"

      - name: Guard — Coverage ratchet + touched-file floor (Phase 0)
        # 2026-08 founder directive — runs even if "Run tests" above
        # failed for pre-existing/unrelated reasons (same if: always()
        # pattern as the Legacy lane step below) so this guard's own
        # signal is never silently swallowed by the wider red suite.
        # coverage.json is written by the step above even on partial
        # failure (pytest-cov flushes on process exit).
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50 || true
            BASE_SHA="origin/$BASE_REF"
            HEAD_SHA="HEAD"
          else
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
              BASE_SHA="HEAD~1"
            else
              BASE_SHA="$BEFORE"
            fi
            HEAD_SHA="$SHA"
          fi
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"coverage-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B "$HEAD_SHA" | grep -q '\[coverage-approved\]'; then
            OVERRIDE="--override"
          fi
          echo "Diffing $BASE_SHA..$HEAD_SHA (override: ${OVERRIDE:-none})"
          python backend/scripts/ci_check_coverage_ratchet.py "$BASE_SHA" "$HEAD_SHA" backend/coverage.json $OVERRIDE

      - name: Guard — Regression baseline lock (Fix 3, hardening)
        # 2026-08 hardening — stricter than the coverage ratchet's
        # touched-file floor above: blocks deploy if the suite's
        # TOTAL failed/errored count goes UP versus the locked
        # baseline in backend/tests/baseline_counts.txt, so a new
        # regression anywhere in the suite can't hide inside the
        # pre-existing red. if: always() — same reasoning as the
        # ratchet guard above, this signal must never be swallowed
        # by an unrelated "Run tests" step failure.
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"regression-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B HEAD | grep -q '\[regression-approved\]'; then
            OVERRIDE="--override"
          fi
          python backend/scripts/ci_check_regression_baseline.py /tmp/pytest_output.txt $OVERRIDE

      - name: Raw exception leak check (Guard 22, Phase 2.3)
        # 2026-08-24 — real, AST-based, CI-enforced check that a raw
        # Python exception message never flows into a customer-facing
        # sink (task step log, chat reply) without going through
        # services.error_classifier.classify_error() first. This is
        # the exact bug class behind the ReRootsBeauty incident
        # ("'str' object has no attribute 'get'" reaching a customer).
        env:
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          OVERRIDE=""
          if [ "$EVENT" = "pull_request" ] && printf '%s' "$PR_LABELS" | grep -q '"raw-error-approved"'; then
            OVERRIDE="--override"
          elif git log -1 --format=%B HEAD | grep -q '\[raw-error-approved\]'; then
            OVERRIDE="--override"
          fi
          python backend/scripts/ci_check_raw_exception_leak.py $OVERRIDE

      - name: Guard — Source-of-truth trip-wires (must never be silently red)
        # W3 · 2026-08 governance ruling — a founder-directed behavior
        # contract test (`@pytest.mark.source_of_truth`) must be its
        # OWN loud, isolated CI signal, never lumped into the general
        # "Run tests" pass/fail count. Root cause this exists: the
        # "Feb 2026 terminal-fail" verify change landed against
        # tests/test_iter309_phase03_self_heal_paused.py without
        # updating it, and it sat silently red inside the wider suite
        # for ~5 weeks because nothing isolated it. if: always() so
        # this signal is never swallowed by an unrelated red "Run
        # tests" step above (same pattern as the Coverage ratchet
        # guard step).
        if: always()
        working-directory: backend
        run: python -m pytest -m source_of_truth -v --tb=short --timeout=30

      - name: Legacy lane (deferred failures — non-blocking)
        # Iter 345 — founder ruling: 259 pre-existing failures
        # (iter36–iter267 era) are quarantined via @pytest.mark.legacy
        # (tests/legacy_quarantine.txt), tracked here, NOT fixed, NOT
        # deleted, and NEVER block this required check.
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          python -m pytest -m legacy --tb=no -q --timeout=30 \
            --continue-on-collection-errors \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py \
            2>&1 | tee /tmp/legacy_output.txt || true
          mkdir -p ../.emergent
          {
            echo "# Legacy Test Report — deferred failures (founder ruling 2026-07-29)"
            echo ""
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ) · commit $(git rev-parse --short HEAD)"
            echo "Quarantined nodeids: $(grep -vc '^#' tests/legacy_quarantine.txt)"
            echo ""
            echo '```'
            tail -3 /tmp/legacy_output.txt
            echo '```'
            echo ""
            echo "Full nodeid list: backend/tests/legacy_quarantine.txt"
          } > ../.emergent/legacy-test-report.md

      - name: Upload legacy lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-test-report
          path: .emergent/legacy-test-report.md
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest_output.txt
          retention-days: 7


  simulated-user-qa:
    # Directive Session — Promptfoo simulated-user QA (self-hosted).
    # Runs 15 real-persona scenarios against the live backend +
    # orchestrator chain. Gates deploy_gate same as ruff/eslint verify.
    name: Simulated-user QA (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Directive-mandated self-hosted flags — no Promptfoo Cloud call.
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_SHARE:              "true"
      PROMPTFOO_DISABLE_TELEMETRY:          "true"
      # Enable QA probe on the CI backend.
      AUREM_QA_MODE:  "true"
      AUREM_QA_TOKEN: "qa-ci-probe-token-must-be-32-chars-min!"
      MONGO_URL:            mongodb://localhost:27017
      DB_NAME:              aurem_qa_ci
      JWT_SECRET:           ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      EMERGENT_LLM_KEY:     ${{ secrets.EMERGENT_LLM_KEY }}
      AUREM_MASTER_KEY: ci-test-master-key-32-chars-long!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/simulated-user/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations is on Emergent's private
          # index (not public PyPI); include --extra-index-url so the
          # GH runner can resolve it.
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Boot backend in background
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done

      - name: Install promptfoo (dev-only)
        working-directory: qa/simulated-user
        run: npm ci --no-audit --no-fund

      - name: Run simulated-user QA suite
        working-directory: qa/simulated-user
        env:
          CI: "true"
        run: bash run.sh

      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulated-user-qa-report
          path: /tmp/aurem_qa_report.json
          retention-days: 14



  security-scan:
    # G15 (2026-08-20) — was raw pip-audit/yarn-audit with
    # continue-on-error: true, so a fixable HIGH/CRITICAL finding
    # never actually blocked anything. Replaced with the real
    # scripts/g15_dependency_scan.py (allowlist-aware, expiry-checked,
    # persists result to synthetic_checks) and the continue-on-error
    # flag removed — this job now actually gates the build.
    name: Security — Dependency audit (G15)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUREM_CI_INGEST_TOKEN: ${{ secrets.AUREM_CI_INGEST_TOKEN }}
      AUREM_API_URL:         ${{ vars.AUREM_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 (for yarn audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps (for yarn audit)
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Guard 15 — dependency CVE scan (blocking)
        working-directory: backend
        run: python scripts/g15_dependency_scan.py


  secret-scan:
    # Iter 212m-120 — Phase 1 of the Vanguard scanner sidecar plan.
    # Runs trufflehog over the full checkout, posts the JSON output
    # to the AUREM backend (/api/aurem-dev/vanguard/ci-findings) so
    # the dashboard can render it next to in-process Vanguard
    # findings, and FAILS the CI run only when at least one VERIFIED
    # secret is detected.  Pattern-only hits warn but don't block —
    # otherwise every fixture/test secret would red-light every PR.
    name: Security — Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Iter 306 — hoist secret to job-level env so the step below can
      # gate itself via `env.CI_TOKEN != ''` (secrets context is
      # disallowed inside step-level `if:`).
      CI_TOKEN: ${{ secrets.AUREM_CI_INGEST_TOKEN }}
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          # Pinned to a stable v3.x — official install script always
          # pulls the latest release and verifies the checksum.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run trufflehog filesystem scan
        id: scan
        run: |
          set +e
          # JSON-lines output → parse later in python.
          trufflehog filesystem . \
            --json \
            --no-update \
            --exclude-paths=.trufflehog-exclude \
            > /tmp/trufflehog.jsonl 2>/tmp/trufflehog.err
          EXIT=$?
          # Exit 183 = findings present (trufflehog convention); 0 =
          # clean; anything else = real failure.
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "183" ]; then
            echo "::warning::trufflehog failed with exit=$EXIT — see stderr"
            cat /tmp/trufflehog.err || true
          fi
          # Always count + classify so the downstream gate has data
          # to act on even if the binary errored mid-run.
          python3 <<'PY'
          import json, os, sys
          rows = []
          try:
              with open("/tmp/trufflehog.jsonl") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          rows.append(json.loads(line))
                      except Exception:
                          pass
          except FileNotFoundError:
              pass
          verified   = sum(1 for r in rows if r.get("Verified"))
          unverified = len(rows) - verified
          print(f"Trufflehog scan: total={len(rows)} verified={verified} unverified={unverified}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"total={len(rows)}\n")
              fh.write(f"verified={verified}\n")
              fh.write(f"unverified={unverified}\n")
          # Emit a compact JSON for the next step to POST.
          with open("/tmp/trufflehog.compact.json", "w") as fh:
              json.dump(rows[:2000], fh)
          PY

      - name: Upload trufflehog raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-jsonl
          path: |
            /tmp/trufflehog.jsonl
            /tmp/trufflehog.err
          retention-days: 7

      - name: Post findings to AUREM dashboard
        if: env.CI_TOKEN != ''
        env:
          API_URL:    ${{ vars.AUREM_API_URL }}
        run: |
          export BASE_URL="${API_URL:-https://auremcto.com}"
          python3 <<'PY'
          import json, os, urllib.request
          with open("/tmp/trufflehog.compact.json") as fh:
              findings = json.load(fh)
          body = {
              "repo":         os.environ["GITHUB_REPOSITORY"],
              "commit":       os.environ["GITHUB_SHA"],
              "branch":       os.environ.get("GITHUB_REF_NAME", ""),
              "scanner":      "trufflehog",
              "findings":     findings,
              "run_url":      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "triggered_by": os.environ.get("GITHUB_ACTOR", ""),
          }
          url = f"{os.environ['BASE_URL']}/api/aurem-dev/vanguard/ci-findings"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              method="POST",
              headers={
                  "Content-Type":  "application/json",
                  "Authorization": f"Bearer {os.environ['CI_TOKEN']}",
              },
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              print("Ingest OK:", resp.status, resp.read().decode()[:200])
          except Exception as e:
              # Soft-fail the report — never block the deploy gate on
              # a backend hiccup. The verified-secret gate below is
              # the real safety check.
              print(f"::warning::AUREM ingest failed: {e!r}")
          PY

      - name: Fail on verified secrets
        if: steps.scan.outputs.verified != '0'
        run: |
          echo "::error::Trufflehog found ${{ steps.scan.outputs.verified }} VERIFIED secrets — blocking merge."
          echo "Download the 'trufflehog-jsonl' artifact for details, or visit the AUREM dashboard."
          exit 1


  deploy-gate:
    name: Deploy gate — all checks passed
    needs: [frontend-build, backend-tests, simulated-user-qa, security-scan, secret-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      # Iter 306 — hoist secret to job-level env so the step below can
      # gate on `env.API_KEY != ''` (secrets context is disallowed
      # inside step-level `if:`).
      API_KEY: ${{ secrets.AUREM_API_KEY }}
    steps:
      - name: All checks passed
        run: |
          echo "✅ Frontend build: passed"
          echo "✅ Backend tests: passed"
          echo "✅ Simulated-user QA: passed"
          echo "✅ Security scan: passed"
          echo "✅ Secret scan:   passed"
          echo "🚀 Safe to deploy to auremcto.com"

      - name: Notify AUREM dashboard
        if: env.API_KEY != ''
        run: |
          curl -s -X POST \
            "https://auremcto.com/api/aurem-dev/github-deploy/report" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$API_KEY\",\"commit\":\"${{ github.sha }}\",\"status\":\"success\",\"repo\":\"${{ github.repository }}\"}" \
            || echo "notify done"

  # ────────────────────────────────────────────────────────────────
  # Iter 331 — DELETE GATE (see docs/DELETE_GATE.md)
  # tool_executor.py was deleted 3× as "dead code" while lazy-imported,
  # crashing every prod chat tool-call. This job blocks undocumented
  # file deletions:
  #   • PR: description MUST contain the check-safe-to-delete.sh
  #     output block ("Script output:").
  #   • Push (Emergent auto-push has no PR): the same push MUST update
  #     docs/DELETE_GATE.md's verdict record — OR (2026-08-26) this job
  #     runs check-safe-to-delete.sh itself and auto-commits the
  #     verdict when every deleted file comes back with ZERO
  #     references, so the audit trail is never skipped by a missed
  #     manual step. Any deletion the script flags as still-referenced
  #     STILL fails the gate for real — this only automates the safe
  #     case, it never rubber-stamps a risky one.
  # ────────────────────────────────────────────────────────────────
  delete-gate:
    name: Delete Gate — dependency-check enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block undocumented file deletions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50 || true
            RANGE="origin/$BASE_REF...HEAD"
          else
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..$SHA"
            fi
          fi
          DELETED=$(git diff --diff-filter=D --name-only $RANGE 2>/dev/null \
            | grep -Ev '^(_deprecated/)' \
            | grep -Ev '\.(png|jpg|jpeg|svg|log|lock|snap)$' || true)
          if [ -z "$DELETED" ]; then
            echo "No source deletions in $RANGE — gate not applicable."
            exit 0
          fi
          echo "⚠️ Deleted files detected in $RANGE:"
          echo "$DELETED"
          if [ "$EVENT" = "pull_request" ]; then
            if printf '%s' "$PR_BODY" | grep -q "Script output:"; then
              echo "✅ PR carries the mandatory check-safe-to-delete.sh output block."
              exit 0
            fi
            echo "::error::File deletion without ./scripts/check-safe-to-delete.sh output in the PR description. See docs/DELETE_GATE.md."
            exit 1
          fi

          if git diff --name-only $RANGE | grep -q "docs/DELETE_GATE.md"; then
            echo "✅ docs/DELETE_GATE.md verdict record updated in the same push."
            exit 0
          fi

          echo "No manual verdict in this push — running check-safe-to-delete.sh for each deleted file to auto-verify."
          echo "$DELETED" > /tmp/deleted_files.txt
          ALL_SAFE=1
          {
            echo ""
            echo "## Auto-verdict — $(date -u +%Y-%m-%dT%H:%M:%SZ) — commit \`${SHA:0:9}\`"
            echo "Generated by the delete-gate CI job (2026-08-26 automation) — no manual"
            echo "docs/DELETE_GATE.md edit was made in this push, so check-safe-to-delete.sh"
            echo "ran automatically for every deleted file below."
            echo ""
          } > /tmp/verdict_block.md
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "${f##*.}" = "py" ] || [ "${f##*.}" = "jsx" ] || [ "${f##*.}" = "js" ] || [ "${f##*.}" = "ts" ] || [ "${f##*.}" = "tsx" ] || continue
            OUT=$(./scripts/check-safe-to-delete.sh "$f" 2>&1 || true)
            {
              echo "### \`$f\`"
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
            } >> /tmp/verdict_block.md
            if ! echo "$OUT" | grep -q "✅ ZERO references found"; then
              ALL_SAFE=0
            fi
          done < /tmp/deleted_files.txt

          if [ "$ALL_SAFE" -eq 1 ]; then
            echo "✅ Every deleted source file has ZERO remaining references — auto-committing the verdict."
            cat /tmp/verdict_block.md >> docs/DELETE_GATE.md
            git config user.name "aurem-delete-gate-bot"
            git config user.email "delete-gate-bot@users.noreply.github.com"
            git add docs/DELETE_GATE.md
            git commit -m "docs: auto-verdict for deletions in ${SHA:0:9} [delete-gate-bot]"
            # GITHUB_TOKEN-authored pushes don't re-trigger push-based
            # workflows (GitHub's own loop guard) — safe to push here.
            git push origin HEAD:"${GITHUB_REF#refs/heads/}"
            exit 0
          fi

          echo "::error::At least one deleted file still has real references — NOT auto-approved. See the check-safe-to-delete.sh output above, investigate, and either restore the file or record a manual verdict in docs/DELETE_GATE.md."
          cat /tmp/verdict_block.md
          exit 1
